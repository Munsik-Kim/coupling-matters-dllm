name: verify
on: [push, pull_request]
jobs:
  model-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r environment/requirements-minimal.txt
      - run: make verify
      - run: make test
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - run: make paper
